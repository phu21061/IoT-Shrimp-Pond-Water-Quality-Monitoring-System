; ============================================================
; PlatformIO Project Configuration
; Smart Water Monitoring System — ESP32-S3 DevKit N16R8
; v2.0 — Dual Firebase (RTDB + Cloud Storage), Alert System
; ============================================================

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Cấu hình bắt buộc cho bộ nhớ của bản N16R8
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB

; Partition scheme — 4 MB app × 2 (OTA) + SPIFFS + coredump
board_build.partitions = default_16MB.csv

; Upload & monitor settings
upload_speed    = 921600
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3            ; INFO level (suppress WiFi verbose spam)
    -DBOARD_HAS_PSRAM
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    -DFIREBASE_USE_PSRAM            ; Firebase lib uses PSRAM for buffers

; ── Libraries ────────────────────────────────────────────────
lib_deps =
    ; Firebase — covers RTDB + Cloud Storage + Auth in one package
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.14

    ; Time synchronisation
    arduino-libraries/NTPClient @ ^3.2.1

    ; JSON parsing & serialisation (used internally by Firebase lib too)
    bblanchon/ArduinoJson @ ^7.1.0

    ; Async WiFi manager — AP + STA, persists credentials to NVS
    tzapu/WiFiManager @ ^2.0.17

    ; No extra RS-485 driver needed — direct HardwareSerial over UART

; ── Extra scripts ─────────────────────────────────────────────
; Uncomment to auto-increment build number
; extra_scripts = pre:scripts/increment_build.py
